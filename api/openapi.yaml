openapi: 3.1.0
info:
  title: Arus Mini ERP API
  version: 0.1.0
  description: REST contract traced to the approved BPMN and business rules.
  license: {name: Proprietary, identifier: LicenseRef-Proprietary}
servers:
  - url: /api/v1
security:
  - accessCookie: []
paths:
  /auth/login:
    post:
      summary: Sign in with an active user account
      security: []
      operationId: CAP-AUTH-001-login
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginRequest'}
      responses:
        '200': {description: Authenticated, content: {application/json: {schema: {$ref: '#/components/schemas/CSRFResponse'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {description: Rate limited}
  /auth/refresh:
    post:
      summary: Rotate the access and refresh token pair
      security: [{refreshCookie: []}]
      operationId: CAP-AUTH-001-refresh
      tags: [Authentication]
      responses:
        '200': {description: Token pair rotated, content: {application/json: {schema: {$ref: '#/components/schemas/CSRFResponse'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /auth/logout:
    post:
      summary: Revoke the current session
      operationId: CAP-AUTH-001-logout
      tags: [Authentication]
      parameters: [{$ref: '#/components/parameters/CSRF'}]
      responses: {'204': {description: Session revoked}, '401': {$ref: '#/components/responses/Unauthorized'}}
  /auth/activate-invitation:
    post:
      summary: Activate an invited user
      security: []
      operationId: AUTH-USR-003-activate
      tags: [Authentication]
      requestBody: {$ref: '#/components/requestBodies/TokenPassword'}
      responses: {'204': {description: User activated}, '400': {$ref: '#/components/responses/ValidationError'}}
  /auth/reset-password:
    post:
      summary: Consume a password reset token
      security: []
      operationId: AUTH-PWD-003-reset
      tags: [Authentication]
      requestBody: {$ref: '#/components/requestBodies/TokenPassword'}
      responses: {'204': {description: Password replaced and sessions revoked}, '400': {$ref: '#/components/responses/ValidationError'}}
  /user-invitations:
    post:
      summary: Invite a user
      operationId: AUTH-USR-001-invite
      tags: [Users]
      parameters: [{$ref: '#/components/parameters/CSRF'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, displayName, role]
              properties:
                email: {type: string, format: email}
                displayName: {type: string}
                role: {type: string, enum: [ADMIN, OPERATOR]}
      responses: {'201': {description: One-time invitation token}, '403': {$ref: '#/components/responses/Forbidden'}}
  /users:
    get:
      summary: List users
      operationId: AUTH-USR-005-list
      tags: [Users]
      responses: {'200': {description: User list}, '403': {$ref: '#/components/responses/Forbidden'}}
  /users/{id}/password-resets:
    post:
      summary: Create a one-time password reset token
      operationId: AUTH-PWD-001-create-reset
      tags: [Users]
      parameters: [{$ref: '#/components/parameters/ID'}, {$ref: '#/components/parameters/CSRF'}]
      responses: {'201': {description: One-time reset token}, '403': {$ref: '#/components/responses/Forbidden'}}
  /users/{id}/{action}:
    post:
      summary: Change user lifecycle or revoke sessions
      operationId: ACT-AUTH-user-action
      tags: [Users]
      parameters:
        - {$ref: '#/components/parameters/ID'}
        - name: action
          in: path
          required: true
          schema: {type: string, enum: [activate, deactivate, revoke-sessions]}
        - {$ref: '#/components/parameters/CSRF'}
      responses: {'204': {description: Action completed}, '409': {description: State or version conflict}}
  /settings/organization:
    get:
      summary: Read organization settings
      operationId: CAP-MDM-001-get-settings
      tags: [Settings]
      responses: {'200': {description: Organization settings}, '403': {$ref: '#/components/responses/Forbidden'}}
    patch:
      summary: Update organization settings
      operationId: CAP-MDM-001-update-settings
      tags: [Settings]
      parameters: [{$ref: '#/components/parameters/CSRF'}]
      responses: {'200': {description: Settings updated}, '409': {description: Invalid settings}}
  /master-data/{resource}:
    parameters:
      - name: resource
        in: path
        required: true
        schema: {type: string, enum: [products, suppliers, customers, units, warehouses]}
    get:
      summary: List records for a master-data resource
      operationId: CAP-MDM-001-list
      tags: [Master Data]
      responses: {'200': {description: Master-data list}, '403': {$ref: '#/components/responses/Forbidden'}}
    post:
      summary: Create a master-data record
      operationId: CAP-MDM-001-create
      tags: [Master Data]
      parameters: [{$ref: '#/components/parameters/CSRF'}]
      responses: {'201': {description: Record created}, '409': {description: Duplicate or invalid record}}
components:
  securitySchemes:
    accessCookie: {type: apiKey, in: cookie, name: __Host-erp_access}
    refreshCookie: {type: apiKey, in: cookie, name: __Host-erp_refresh}
  parameters:
    ID: {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    CSRF: {name: X-CSRF-Token, in: header, required: true, schema: {type: string}}
  schemas:
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties: {email: {type: string, format: email}, password: {type: string, format: password}}
    CSRFResponse:
      type: object
      required: [csrfToken]
      properties: {csrfToken: {type: string}}
    TokenPassword:
      type: object
      required: [token, password]
      properties: {token: {type: string}, password: {type: string, minLength: 12}}
    Error:
      type: object
      required: [message]
      properties: {message: {type: string}}
  requestBodies:
    TokenPassword:
      required: true
      content: {application/json: {schema: {$ref: '#/components/schemas/TokenPassword'}}}
  responses:
    Unauthorized: {description: Authentication failed, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    Forbidden: {description: Permission or CSRF check failed, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    ValidationError: {description: Invalid input or token, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}

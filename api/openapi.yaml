openapi: 3.1.0
info:
  title: Arus Mini ERP API
  version: 0.1.0
  description: REST contract traced to the approved BPMN and business rules.
  license: {name: Proprietary, identifier: LicenseRef-Proprietary}
servers:
  - url: /api/v1
security:
  - accessCookie: []
paths:
  /auth/login:
    post:
      summary: Sign in with an active user account
      security: []
      operationId: CAP-AUTH-001-login
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginRequest'}
      responses:
        '200': {description: Authenticated, content: {application/json: {schema: {$ref: '#/components/schemas/CSRFResponse'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {description: Rate limited}
  /auth/refresh:
    post:
      summary: Rotate the access and refresh token pair
      security: [{refreshCookie: []}]
      operationId: CAP-AUTH-001-refresh
      tags: [Authentication]
      responses:
        '200': {description: Token pair rotated, content: {application/json: {schema: {$ref: '#/components/schemas/CSRFResponse'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /auth/logout:
    post:
      summary: Revoke the current session
      operationId: CAP-AUTH-001-logout
      tags: [Authentication]
      parameters: [{$ref: '#/components/parameters/CSRF'}]
      responses: {'204': {description: Session revoked}, '401': {$ref: '#/components/responses/Unauthorized'}}
  /auth/activate-invitation:
    post:
      summary: Activate an invited user
      security: []
      operationId: AUTH-USR-003-activate
      tags: [Authentication]
      requestBody: {$ref: '#/components/requestBodies/TokenPassword'}
      responses: {'204': {description: User activated}, '400': {$ref: '#/components/responses/ValidationError'}}
  /auth/reset-password:
    post:
      summary: Consume a password reset token
      security: []
      operationId: AUTH-PWD-003-reset
      tags: [Authentication]
      requestBody: {$ref: '#/components/requestBodies/TokenPassword'}
      responses: {'204': {description: Password replaced and sessions revoked}, '400': {$ref: '#/components/responses/ValidationError'}}
  /user-invitations:
    post:
      summary: Invite a user
      operationId: AUTH-USR-001-invite
      tags: [Users]
      parameters: [{$ref: '#/components/parameters/CSRF'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, displayName, role]
              properties:
                email: {type: string, format: email}
                displayName: {type: string}
                role: {type: string, enum: [ADMIN, OPERATOR]}
      responses: {'201': {description: One-time invitation token}, '403': {$ref: '#/components/responses/Forbidden'}}
  /users:
    get:
      summary: List users
      operationId: AUTH-USR-005-list
      tags: [Users]
      responses: {'200': {description: User list}, '403': {$ref: '#/components/responses/Forbidden'}}
  /users/{id}/password-resets:
    post:
      summary: Create a one-time password reset token
      operationId: AUTH-PWD-001-create-reset
      tags: [Users]
      parameters: [{$ref: '#/components/parameters/ID'}, {$ref: '#/components/parameters/CSRF'}]
      responses: {'201': {description: One-time reset token}, '403': {$ref: '#/components/responses/Forbidden'}}
  /users/{id}/{action}:
    post:
      summary: Change user lifecycle or revoke sessions
      operationId: ACT-AUTH-user-action
      tags: [Users]
      parameters:
        - {$ref: '#/components/parameters/ID'}
        - name: action
          in: path
          required: true
          schema: {type: string, enum: [activate, deactivate, revoke-sessions]}
        - {$ref: '#/components/parameters/CSRF'}
      responses: {'204': {description: Action completed}, '409': {description: State or version conflict}}
  /settings/organization:
    get:
      summary: Read organization settings
      operationId: CAP-MDM-001-get-settings
      tags: [Settings]
      responses: {'200': {description: Organization settings}, '403': {$ref: '#/components/responses/Forbidden'}}
    patch:
      summary: Update organization settings
      operationId: CAP-MDM-001-update-settings
      tags: [Settings]
      parameters: [{$ref: '#/components/parameters/CSRF'}]
      responses: {'200': {description: Settings updated}, '409': {description: Invalid settings}}
  /master-data/{resource}:
    parameters:
      - name: resource
        in: path
        required: true
        schema: {type: string, enum: [products, suppliers, customers, units, warehouses]}
    get:
      summary: List records for a master-data resource
      operationId: CAP-MDM-001-list
      tags: [Master Data]
      responses: {'200': {description: Master-data list}, '403': {$ref: '#/components/responses/Forbidden'}}
    post:
      summary: Create a master-data record
      operationId: CAP-MDM-001-create
      tags: [Master Data]
      parameters: [{$ref: '#/components/parameters/CSRF'}]
      responses: {'201': {description: Record created}, '409': {description: Duplicate or invalid record}}
  /purchase-requests:
    get:
      summary: List purchase requests
      operationId: purchase-requests-list
      tags: [Purchasing]
      responses: {'200': {description: Purchase requests}, '401': {$ref: '#/components/responses/Unauthorized'}}
    post:
      summary: Create a draft purchase request
      operationId: PUR-PR-001-create
      tags: [Purchasing]
      parameters: [{$ref: '#/components/parameters/CSRF'}, {$ref: '#/components/parameters/Idempotency'}]
      responses: {'201': {description: Draft created}, '409': {description: Invalid input}}
  /purchase-requests/{id}/{action}:
    post:
      summary: Run a purchase request state command
      operationId: purchase-request-command
      tags: [Purchasing]
      parameters:
        - {$ref: '#/components/parameters/ID'}
        - name: action
          in: path
          required: true
          schema: {type: string, enum: [submit, approve, reject, cancel, copy, purchase-order]}
        - {$ref: '#/components/parameters/CSRF'}
        - {$ref: '#/components/parameters/Idempotency'}
      responses: {'200': {description: State changed}, '409': {description: Invalid transition or maker-checker conflict}}
  /purchase-orders/{id}/{action}:
    post:
      summary: Issue or cancel a purchase order
      operationId: purchase-order-command
      tags: [Purchasing]
      parameters:
        - {$ref: '#/components/parameters/ID'}
        - name: action
          in: path
          required: true
          schema: {type: string, enum: [issue, cancel]}
        - {$ref: '#/components/parameters/CSRF'}
        - {$ref: '#/components/parameters/Idempotency'}
      responses: {'200': {description: State changed}, '409': {description: Invalid transition}}
  /purchase-orders/{id}/goods-receipts:
    post:
      summary: Create a partial or final goods receipt
      operationId: PUR-GR-001-create
      tags: [Purchasing, Inventory]
      parameters: [{$ref: '#/components/parameters/ID'}, {$ref: '#/components/parameters/CSRF'}, {$ref: '#/components/parameters/Idempotency'}]
      responses: {'201': {description: Draft receipt created}, '409': {description: Invalid remaining quantity}}
  /goods-receipts/{id}/{action}:
    post:
      summary: Post, cancel, or reverse a goods receipt
      operationId: goods-receipt-command
      tags: [Purchasing, Inventory]
      parameters:
        - {$ref: '#/components/parameters/ID'}
        - name: action
          in: path
          required: true
          schema: {type: string, enum: [post, cancel, reverse]}
        - {$ref: '#/components/parameters/CSRF'}
        - {$ref: '#/components/parameters/Idempotency'}
      responses: {'200': {description: Receipt changed atomically with stock}, '409': {description: "State, quantity, or reversal conflict"}}
  /sales-orders:
    get:
      summary: List sales orders
      operationId: sales-orders-list
      tags: [Sales]
      responses: {'200': {description: Sales orders}, '401': {$ref: '#/components/responses/Unauthorized'}}
    post:
      summary: Create a draft sales order
      operationId: SAL-SO-001-create
      tags: [Sales]
      parameters: [{$ref: '#/components/parameters/CSRF'}, {$ref: '#/components/parameters/Idempotency'}]
      responses: {'201': {description: Draft created}, '409': {description: Invalid input}}
  /sales-orders/{id}/{action}:
    post:
      summary: Run a sales order state command
      operationId: sales-order-command
      tags: [Sales]
      parameters:
        - {$ref: '#/components/parameters/ID'}
        - name: action
          in: path
          required: true
          schema: {type: string, enum: [validate-stock, submit, approve, reject, cancel, copy, confirm]}
        - {$ref: '#/components/parameters/CSRF'}
        - {$ref: '#/components/parameters/Idempotency'}
      responses: {'200': {description: State changed}, '409': {description: "Invalid transition, stock, or maker-checker conflict"}}
  /sales-orders/{id}/deliveries:
    post:
      summary: Create a partial or final sales delivery
      operationId: SAL-DLV-001-create
      tags: [Sales, Inventory]
      parameters: [{$ref: '#/components/parameters/ID'}, {$ref: '#/components/parameters/CSRF'}, {$ref: '#/components/parameters/Idempotency'}]
      responses: {'201': {description: Draft delivery created}, '409': {description: Invalid remaining quantity}}
  /deliveries/{id}/{action}:
    post:
      summary: Post, cancel, or reverse a delivery
      operationId: delivery-command
      tags: [Sales, Inventory]
      parameters:
        - {$ref: '#/components/parameters/ID'}
        - name: action
          in: path
          required: true
          schema: {type: string, enum: [post, cancel, reverse]}
        - {$ref: '#/components/parameters/CSRF'}
        - {$ref: '#/components/parameters/Idempotency'}
      responses: {'200': {description: Delivery changed atomically with stock}, '409': {description: "State, quantity, stock, or reversal conflict"}}
  /inventory/balances:
    get:
      summary: Read current stock projections
      operationId: inventory-balances-list
      tags: [Inventory]
      responses: {'200': {description: Balances rebuilt from ledger}, '401': {$ref: '#/components/responses/Unauthorized'}}
  /inventory/movements:
    get:
      summary: Read immutable stock movements
      operationId: inventory-movements-list
      tags: [Inventory]
      responses: {'200': {description: Source-linked movement ledger}, '401': {$ref: '#/components/responses/Unauthorized'}}
  /inventory-adjustments:
    post:
      summary: Create a stock-count adjustment draft
      operationId: INV-ADJ-001-create
      tags: [Inventory]
      parameters: [{$ref: '#/components/parameters/CSRF'}, {$ref: '#/components/parameters/Idempotency'}]
      responses: {'201': {description: Draft with stock snapshot}, '409': {description: Invalid count}}
  /inventory-adjustments/{id}/{action}:
    post:
      summary: Run an inventory adjustment state command
      operationId: inventory-adjustment-command
      tags: [Inventory]
      parameters:
        - {$ref: '#/components/parameters/ID'}
        - name: action
          in: path
          required: true
          schema: {type: string, enum: [submit, approve, reject, cancel, post, reverse]}
        - {$ref: '#/components/parameters/CSRF'}
        - {$ref: '#/components/parameters/Idempotency'}
      responses: {'200': {description: State changed atomically}, '409': {description: "State, snapshot, stock, or maker-checker conflict"}}
  /supplier-invoices:
    get:
      summary: List supplier invoices and outstanding AP
      operationId: supplier-invoices-list
      tags: [Finance]
      responses: {'200': {description: Supplier invoices}, '403': {$ref: '#/components/responses/Forbidden'}}
    post:
      summary: Record a consolidated supplier invoice for exact matching
      operationId: PUR-INV-001-create
      tags: [Finance]
      parameters: [{$ref: '#/components/parameters/CSRF'}, {$ref: '#/components/parameters/Idempotency'}]
      responses: {'201': {description: MATCH_PENDING invoice}, '409': {description: "Early, duplicate, or invalid invoice"}}
  /supplier-invoices/{id}/{action}:
    post:
      summary: Match, resolve, or void a supplier invoice
      operationId: supplier-invoice-command
      tags: [Finance]
      parameters:
        - {$ref: '#/components/parameters/ID'}
        - name: action
          in: path
          required: true
          schema: {type: string, enum: [match, resolve-match, void]}
        - {$ref: '#/components/parameters/CSRF'}
        - {$ref: '#/components/parameters/Idempotency'}
      responses: {'200': {description: "PUR-INV-002, PUR-INV-003, or ACT-FIN-SINV-VOID applied"}, '409': {description: Match or state conflict}}
  /supplier-payments:
    get:
      summary: List supplier payments
      operationId: supplier-payments-list
      tags: [Finance]
      responses: {'200': {description: Supplier payments}, '403': {$ref: '#/components/responses/Forbidden'}}
    post:
      summary: Create a supplier payment draft with allocations
      operationId: PUR-PAY-001-create
      tags: [Finance]
      parameters: [{$ref: '#/components/parameters/CSRF'}, {$ref: '#/components/parameters/Idempotency'}]
      responses: {'201': {description: Payment draft}, '409': {description: Invalid allocation}}
  /supplier-payments/{id}/{action}:
    post:
      summary: Post or void a supplier payment
      operationId: supplier-payment-command
      tags: [Finance]
      parameters:
        - {$ref: '#/components/parameters/ID'}
        - name: action
          in: path
          required: true
          schema: {type: string, enum: [post, void]}
        - {$ref: '#/components/parameters/CSRF'}
        - {$ref: '#/components/parameters/Idempotency'}
      responses: {'200': {description: PUR-PAY-002 or ACT-FIN-SPAY-VOID applied}, '409': {description: Payment or allocation conflict}}
  /sales-orders/{id}/sales-invoice:
    post:
      summary: Create the consolidated sales invoice after full delivery
      operationId: SAL-INV-001-create
      tags: [Finance]
      parameters: [{$ref: '#/components/parameters/ID'}, {$ref: '#/components/parameters/CSRF'}, {$ref: '#/components/parameters/Idempotency'}]
      responses: {'201': {description: Posted sales invoice}, '409': {description: Early or duplicate invoice}}
  /sales-invoices:
    get:
      summary: List sales invoices and outstanding AR
      operationId: sales-invoices-list
      tags: [Finance]
      responses: {'200': {description: Sales invoices}, '403': {$ref: '#/components/responses/Forbidden'}}
  /sales-invoices/{id}/void:
    post:
      summary: Void an unallocated sales invoice with a reason
      operationId: ACT-FIN-CINV-VOID
      tags: [Finance]
      parameters: [{$ref: '#/components/parameters/ID'}, {$ref: '#/components/parameters/CSRF'}, {$ref: '#/components/parameters/Idempotency'}]
      responses: {'200': {description: Invoice voided}, '409': {description: Active allocation or state conflict}}
  /customer-payments:
    get:
      summary: List customer payments
      operationId: customer-payments-list
      tags: [Finance]
      responses: {'200': {description: Customer payments}, '403': {$ref: '#/components/responses/Forbidden'}}
    post:
      summary: Create a customer payment draft with allocations
      operationId: SAL-PAY-001-create
      tags: [Finance]
      parameters: [{$ref: '#/components/parameters/CSRF'}, {$ref: '#/components/parameters/Idempotency'}]
      responses: {'201': {description: Payment draft}, '409': {description: Invalid allocation}}
  /customer-payments/{id}/{action}:
    post:
      summary: Post or void a customer payment
      operationId: customer-payment-command
      tags: [Finance]
      parameters:
        - {$ref: '#/components/parameters/ID'}
        - name: action
          in: path
          required: true
          schema: {type: string, enum: [post, void]}
        - {$ref: '#/components/parameters/CSRF'}
        - {$ref: '#/components/parameters/Idempotency'}
      responses: {'200': {description: SAL-PAY-002 or ACT-FIN-CPAY-VOID applied}, '409': {description: Payment or allocation conflict}}
  /dashboard/summary:
    get:
      summary: Read reconciled operational and finance attention metrics
      operationId: CAP-RPT-001-dashboard
      tags: [Reporting]
      responses: {'200': {description: Dashboard summary}, '401': {$ref: '#/components/responses/Unauthorized'}}
  /reports/{report}:
    get:
      summary: Read an Admin-only operational or finance report
      operationId: CAP-RPT-001-report
      tags: [Reporting]
      parameters:
        - name: report
          in: path
          required: true
          schema: {type: string, enum: [purchases, sales, inventory, payables, receivables]}
      responses: {'200': {description: Reconciled report rows}, '403': {$ref: '#/components/responses/Forbidden'}}
  /audit-logs:
    get:
      summary: Search immutable redacted audit records
      operationId: CAP-AUD-001-list
      tags: [Audit]
      parameters:
        - {name: entity, in: query, schema: {type: string}}
        - {name: actor, in: query, schema: {type: string, format: uuid}}
        - {name: action, in: query, schema: {type: string}}
      responses: {'200': {description: Source-linked audit records}, '403': {$ref: '#/components/responses/Forbidden'}}
components:
  securitySchemes:
    accessCookie: {type: apiKey, in: cookie, name: __Host-erp_access}
    refreshCookie: {type: apiKey, in: cookie, name: __Host-erp_refresh}
  parameters:
    ID: {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    CSRF: {name: X-CSRF-Token, in: header, required: true, schema: {type: string}}
    Idempotency: {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 1, maxLength: 200}}
  schemas:
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties: {email: {type: string, format: email}, password: {type: string, format: password}}
    CSRFResponse:
      type: object
      required: [csrfToken]
      properties: {csrfToken: {type: string}}
    TokenPassword:
      type: object
      required: [token, password]
      properties: {token: {type: string}, password: {type: string, minLength: 12}}
    Error:
      type: object
      required: [message]
      properties: {message: {type: string}}
  requestBodies:
    TokenPassword:
      required: true
      content: {application/json: {schema: {$ref: '#/components/schemas/TokenPassword'}}}
  responses:
    Unauthorized: {description: Authentication failed, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    Forbidden: {description: Permission or CSRF check failed, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    ValidationError: {description: Invalid input or token, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}

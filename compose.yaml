services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-simple_erp}
      POSTGRES_USER: ${POSTGRES_USER:-simple_erp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-simple_erp_local}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    environment:
      APP_ENV: ${APP_ENV:-development}
      HTTP_ADDRESS: :8080
      TRUSTED_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
      DATABASE_URL: postgres://${POSTGRES_USER:-simple_erp}:${POSTGRES_PASSWORD:-simple_erp_local}@postgres:5432/${POSTGRES_DB:-simple_erp}?sslmode=disable
      SESSION_PEPPER: ${SESSION_PEPPER:-local-development-pepper-change-me-32-bytes}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        INTERNAL_API_ORIGIN: http://backend:8080
    environment:
      INTERNAL_API_ORIGIN: http://backend:8080
      NEXT_PUBLIC_API_BASE_URL: /api/v1
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:

name: verify

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: simple_erp_test
          POSTGRES_USER: simple_erp
          POSTGRES_PASSWORD: test-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U simple_erp -d simple_erp_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://simple_erp:test-only@localhost:5432/simple_erp_test?sslmode=disable
      TEST_DATABASE_URL: postgres://simple_erp:test-only@localhost:5432/simple_erp_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: backend/go.mod, cache-dependency-path: backend/go.sum }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: make install
      - run: make lint typecheck test test-race
      - run: make migrate-up
      - run: make test-integration migrate-verify
      - run: make openapi-verify traceability-verify
